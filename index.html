<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna</title>
<style>
  body{font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
  #top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #ccc}
  #panel{display:none;padding:8px 12px;border-bottom:1px solid #ccc;overflow:auto;max-height:55vh}
  #panel textarea{width:100%;box-sizing:border-box;font-size:15px;margin:4px 0 8px}
  #chat{flex:1;overflow:auto;padding:12px}
  .m{margin:8px 0;padding:8px 12px;border-radius:12px;max-width:80%;white-space:pre-wrap}
  .luna{background:#eee;color:#000}
  .yo{background:#cfe8ff;color:#000;margin-left:auto}
  #barra{display:flex;gap:8px;padding:8px}
  #texto{flex:1;padding:10px;font-size:16px}
  button{padding:10px 14px}
</style>
</head>
<body>
<div id="top"><strong>Luna</strong><button id="btnPerfil">Mi perfil</button></div>
<div id="panel">
  <label>Cuéntale a Luna sobre ti (objetivos, rutina, cómo quieres que te hable):</label>
  <textarea id="perfilTxt" rows="6"></textarea>
  <label>Lo que Luna recuerda (una cosa por línea, puedes borrar o editar):</label>
  <textarea id="notasTxt" rows="5"></textarea>
  <button id="btnGuardar">Guardar</button>
</div>
<div id="chat"></div>
<div id="barra">
  <input id="texto" placeholder="Escríbele a Luna">
  <button id="btn">Enviar</button>
</div>
<script>
const WORKER_URL = "https://larayaj1993-ctrl.github.io/Luna-/";

const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let historial = ls.get('luna_historial', []);
let notas = ls.get('luna_notas', []);
let perfil = ls.get('luna_perfil', '');

const chat = document.getElementById('chat');
const texto = document.getElementById('texto');
const panel = document.getElementById('panel');
const perfilTxt = document.getElementById('perfilTxt');
const notasTxt = document.getElementById('notasTxt');

function agregar(t, c) {
  const d = document.createElement('div');
  d.className = 'm ' + c;
  d.textContent = t;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function pedir(modo) {
  const ahora = new Date().toLocaleString('es', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  const r = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mensajes: historial.slice(-20), perfil, notas, modo, ahora })
  });
  const d = await r.json();
  return d.texto || 'No pude responder ahora.';
}

function procesar(t) {
  const re = /\[\[RECORDAR:\s*(.*?)\]\]/g;
  let m;
  while ((m = re.exec(t)) !== null) {
    const n = m[1].trim();
    if (n && !notas.includes(n)) notas.push(n);
  }
  notas = notas.slice(-30);
  ls.set('luna_notas', notas);
  return t.replace(re, '').trim();
}

function guardarHistorial() { ls.set('luna_historial', historial.slice(-40)); }

async function enviar() {
  const t = texto.value.trim();
  if (!t) return;
  texto.value = '';
  agregar(t, 'yo');
  historial.push({ rol: 'yo', texto: t });
  const espera = agregar('Luna está pensando...', 'luna');
  try {
    const limpio = procesar(await pedir('chat'));
    espera.textContent = limpio;
    historial.push({ rol: 'luna', texto: limpio });
  } catch (e) {
    espera.textContent = 'No pude conectarme. Intenta de nuevo.';
  }
  guardarHistorial();
}

async function saludar() {
  const ultimo = ls.get('luna_ultimo_saludo', 0);
  const tresHoras = 3 * 60 * 60 * 1000;
  if (Date.now() - ultimo < tresHoras) return;
  ls.set('luna_ultimo_saludo', Date.now());
  const espera = agregar('Luna está pensando...', 'luna');
  try {
    const limpio = procesar(await pedir('saludo'));
    espera.textContent = limpio;
    historial.push({ rol: 'luna', texto: limpio });
  } catch (e) {
    espera.textContent = 'Hola, soy Luna. No pude conectarme ahora, pero aquí estoy.';
  }
  guardarHistorial();
}

document.getElementById('btnPerfil').onclick = () => {
  perfilTxt.value = perfil;
  notasTxt.value = notas.join('\n');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
};
document.getElementById('btnGuardar').onclick = () => {
  perfil = perfilTxt.value.trim().slice(0, 2000);
  notas = notasTxt.value.split('\n').map(s => s.trim()).filter(Boolean).slice(-30);
  ls.set('luna_perfil', perfil);
  ls.set('luna_notas', notas);
  panel.style.display = 'none';
};
document.getElementById('btn').onclick = enviar;
texto.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

historial.forEach(m => agregar(m.texto, m.rol));
saludar();
</script>
</body>
</html>
